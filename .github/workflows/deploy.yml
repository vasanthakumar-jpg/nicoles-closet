name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions. Publishing main/root serves unbuilt index.html and overrides the Vite deployment."
            exit 1
          fi

      - name: Build website
        run: npm run build

      - name: Verify compiled Pages artifact
        run: npm run verify:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
